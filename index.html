<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eclipse Client | Minecraft Performance Client</title>
    <meta
      name="description"
      content="Eclipse Client is a high-performance Minecraft client with PvP modules, optimized FPS, and a clean drag-and-drop HUD."
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap');

      :root {
        --bg: #070b14;
        --bg-2: #0d1220;
        --panel: rgba(15, 18, 28, 0.7);
        --panel-strong: rgba(13, 18, 26, 0.95);
        --panel-border: rgba(255,255,255,0.08);
        --text: #f8f4ff;
        --muted: rgba(230, 224, 245, 0.72);
        --gold: #f4c75d;
        --gold-strong: #ffbf46;
        --gold-soft: rgba(244, 199, 93, 0.16);
        --violet: #9c7dff;
        --violet-2: #7b5cf3;
        --violet-soft: rgba(156, 125, 255, 0.16);
        --cyan: #8fe6ff;
        --shadow: rgba(7, 10, 18, 0.72);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(2, 7, 13, 0.72), rgba(7, 13, 23, 0.8)),
          url('eclipsebackground.png') center center / cover no-repeat fixed;
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(2px 2px at 10% 18%, rgba(255,255,255,0.9) 0, transparent 100%),
          radial-gradient(2px 2px at 22% 28%, rgba(255,255,255,0.8) 0, transparent 100%),
          radial-gradient(2px 2px at 38% 12%, rgba(255,255,255,0.8) 0, transparent 100%),
          radial-gradient(1.8px 1.8px at 48% 22%, rgba(255,255,255,0.85) 0, transparent 100%),
          radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,0.8) 0, transparent 100%),
          radial-gradient(2px 2px at 72% 18%, rgba(255,255,255,0.9) 0, transparent 100%),
          radial-gradient(1.8px 1.8px at 80% 24%, rgba(255,255,255,0.75) 0, transparent 100%),
          radial-gradient(2px 2px at 92% 18%, rgba(255,255,255,0.8) 0, transparent 100%);
        opacity: 0.95;
      }

      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .page-shell { position: relative; z-index: 1; }

      .container {
        width: min(1550px, calc(100% - 44px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(4, 9, 17, 0.7);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 88px;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        position: relative;
        background: radial-gradient(circle at 30% 28%, #fff9ea 0%, #f8d67c 14%, #ad7f2d 50%, #10161c 58%, #000 100%);
        box-shadow: 0 0 18px rgba(156,125,255,0.6), 0 0 18px rgba(244,199,93,0.5);
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0 50%, rgba(0,0,0,0.95) 50% 100%);
      }

      .brand-name {
        font-size: 1.06rem;
        color: var(--violet);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: clamp(18px, 3vw, 44px);
        color: rgba(255,255,255,0.8);
        font-weight: 500;
      }

      .nav a:hover { color: var(--text); }

      .download-btn,
      .primary-btn,
      .secondary-btn,
      .mini-btn {
        border: none;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }

      .download-btn:hover, .primary-btn:hover, .secondary-btn:hover, .mini-btn:hover { transform: translateY(-1px); }

      .download-btn {
        min-width: 170px;
        height: 48px;
        padding: 0 18px;
        border-radius: 10px;
        background: linear-gradient(180deg, #f3d67f 0%, #d6901d 100%);
        color: #17130b;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        box-shadow: 0 10px 24px rgba(244,199,93,0.30);
      }

      .hero {
        position: relative;
        min-height: 820px;
        padding-top: 32px;
      }

      .hero-inner {
        display: grid;
        grid-template-columns: 1.06fr 1fr;
        align-items: center;
        gap: 18px;
      }

      .hero-copy {
        padding: 8px 0 8px 8px;
      }

      .version-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        padding: 10px 16px;
        background: rgba(25, 18, 35, 0.28);
        border: 1px solid rgba(173, 135, 255, 0.7);
        border-radius: 8px;
        color: var(--gold);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .version-pill::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: linear-gradient(180deg, #fdefb9 0%, #d98c1d 100%);
        box-shadow: 0 0 12px rgba(244,199,93,0.72);
      }

      .hero h1 {
        margin: 0;
        font-family: 'Archivo Black', sans-serif;
        font-size: clamp(4.3rem, 7vw, 12rem);
